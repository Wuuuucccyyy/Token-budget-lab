name: offline-tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python -m token_budget_lab --output local_results
      - run: python -m token_budget_lab.experiment --config configs/deepseek_pilot.json --dry-run
      - run: python scripts/reproduce.py --output local_results/public-ci
      - run: python scripts/reproduce_rag_budget.py --output local_results/rag-budget-ci
      - run: python -m token_budget_lab.rag_experiment --config configs/rag_budget_deepseek_pilot.json --output local_results/rag-live-plan --plan
      - run: python -m token_budget_lab.memory_experiment --config configs/agent_memory_offline.json --output local_results/memory-ci
      - run: python -m token_budget_lab.memory_experiment --config configs/agent_memory_deepseek.json --output local_results/memory-live-plan --plan
      - run: python examples/python_memory_agent.py
      - run: python scripts/analyze_agent_memory.py --answers results/agent_memory/deepseek_pilot/final_answers.csv --output local_results/memory-format-ci
      - run: python -m token_budget_lab.tool_experiment --config configs/agent_tools_offline.json --output local_results/tools-ci
      - run: python -m token_budget_lab.tool_experiment --config configs/agent_tools_deepseek.json --output local_results/tools-live-plan --plan
      - run: python scripts/prepare_long_context_tasks.py
      - run: python -m token_budget_lab.tool_experiment --config configs/agent_long_context_offline.json --output local_results/long-context-ci
      - run: python -m token_budget_lab.tool_experiment --config configs/agent_long_context_deepseek.json --output local_results/long-context-live-plan --plan
      - run: python -m token_budget_lab.tool_experiment --config configs/agent_recovery_guard_deepseek.json --output local_results/recovery-guard-live-plan --plan
      - run: python -m pip install --no-deps .
      - run: python -I -c "from token_budget_lab.memory import HistoryArchive, MemoryPlugin; from token_budget_lab.memory_agent import run_agent"
