name: offline-tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python -m token_budget_lab --output local_results
      - run: python -m token_budget_lab.experiment --config configs/deepseek_pilot.json --dry-run
      - run: python scripts/reproduce.py --output local_results/public-ci
