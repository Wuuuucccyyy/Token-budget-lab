name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python examples/python_agent.py
      - run: python -m token_budget_lab.action_experiment --config configs/action_contract_deepseek.json --plan
      - run: python -m token_budget_lab.action_experiment --config configs/locator_deepseek.json --plan
      - run: python -m token_budget_lab.action_experiment --config configs/transform_deepseek.json --plan
      - run: python -m token_budget_lab.action_experiment --config configs/fast_deepseek.json --plan
      - run: python -m pip install --no-deps .
      - run: python -I -c "from token_budget_lab import ContextPlugin, HistoryArchive, ActionContract, RequiredAction, HistoricalWriteGuard, FreshWriteGuard, WriteTransform, DeepSeekChat, run_agent"
      - run: python -m pip install ".[langchain]" -c configs/langchain_constraints.txt
      - run: python -m unittest discover -s tests -p "test_langchain*.py" -v
      - run: python examples/langchain_agent.py
      - run: python examples/langchain_agent.py --without-plugin
      - run: python -m token_budget_lab.langchain_experiment --plan
