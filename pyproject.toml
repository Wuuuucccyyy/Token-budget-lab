[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "token-budget-lab"
version = "0.12.0"
description = "Embedded context compression, evidence recovery and execution checks for Python agents"
requires-python = ">=3.10"
authors = [{name = "Wuuuucccyyy"}]
license = {text = "MIT"}
dependencies = []

[tool.setuptools.packages.find]
include = ["token_budget_lab*"]

[project.optional-dependencies]
tokenizer = ["tiktoken>=0.8,<1"]
